[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gz-tuning"
version = "0.1.0"
description = "Ground-zero POMDP+SLAM active exploration for capacitively-coupled double quantum dot charge tuning"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [
    { name = "ual-laptop" }
]

# Pinned to match the environment actually validated (Colab 2026.07 runtime,
# Python 3.12.13) — qarray-rust-core has no prebuilt wheel for 3.13 as of
# qarray 1.6.0 / qarray-rust-core 1.3.1. See docs/PRIMER.md Section 9 and the
# Colab setup notes in notebooks/00_env_smoke_test.ipynb before bumping this.
dependencies = [
    "qarray==1.6.0",
    "numpy>=2.0,<2.3",
    "scipy>=1.13",
    "pydantic>=2.0",
]

[project.optional-dependencies]
# JAX QArray backend — not yet benchmarked against the swap-heavy per-particle
# access pattern (Primer Section 9, "Not yet checked"). Install on demand only.
jax = [
    "jax>=0.4",
    "jaxlib>=0.4",
]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
