name: Train Phase 1 Classifier

on:
  workflow_dispatch:
    inputs:
      fast:
        description: "Run reduced quick training (debug/smoke); disable for full training"
        required: false
        default: false
        type: boolean
      upload_artifact_name:
        description: "Artifact name to upload (default supports CI checkpoint download)"
        required: false
        default: "phase1-checkpoint-latest"
        type: string
  schedule:
    - cron: "0 2 * * 0"

concurrency:
  group: train-phase1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install numpy scipy pytest pytest-cov ruff
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install scikit-learn scikit-optimize joblib opencv-python
          pip install -e . --no-deps

      - name: Train Phase 1 ensemble + OOD detector
        env:
          RUN_FAST: ${{ github.event_name == 'workflow_dispatch' && inputs.fast || false }}
        run: |
          if [ "$RUN_FAST" = "true" ]; then
            python experiments/train_phase1.py --fast --out experiments/checkpoints/phase1
          else
            python experiments/train_phase1.py --out experiments/checkpoints/phase1
          fi

      - name: Verify checkpoint files exist
        run: |
          for f in model_0.pt model_1.pt model_2.pt model_3.pt model_4.pt ood_detector.pkl training_log.json; do
            test -f "experiments/checkpoints/phase1/$f" || (echo "Missing: $f" && exit 1)
          done
          echo "All checkpoint files present"

      - name: Print training summary
        run: |
          python - <<'PYEOF'
          import json
          import pathlib

          log = json.loads(pathlib.Path('experiments/checkpoints/phase1/training_log.json').read_text())
          results = log.get('results', {})
          config = log.get('config', {})
          print('Val accuracy (CIM):', results.get('val_accuracy_cim', 'n/a'))
          print('Epochs:', config.get('n_epochs', 'n/a'))
          print('Timestamp:', log.get('timestamp', 'n/a'))
          PYEOF

      - name: Upload checkpoint artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_artifact_name || 'phase1-checkpoint-latest' }}
          path: experiments/checkpoints/phase1/
          retention-days: 90
          if-no-files-found: error
